[project]
name = "kv-efficiency"
version = "0.1.0"
description = "Adaptive KV-cache efficiency under bounded downstream damage"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
